name: Deploy JD Cloud Octopus

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      target_arch:
        description: "Linux architecture to deploy"
        required: false
        default: amd64
        type: choice
        options:
          - amd64
          - arm64

concurrency:
  group: deploy-jd-octopus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      JD_HOST: ${{ secrets.JD_HOST }}
      JD_PORT: ${{ secrets.JD_PORT || '22' }}
      JD_USER: ${{ secrets.JD_USER || 'root' }}
      JD_APP_DIR: ${{ secrets.JD_APP_DIR || '/opt/octopus' }}
      JD_SERVICE_NAME: ${{ secrets.JD_SERVICE_NAME || 'octopus' }}
      JD_PUBLIC_URL: ${{ secrets.JD_PUBLIC_URL }}
      JD_HOST_FINGERPRINT: ${{ secrets.JD_HOST_FINGERPRINT }}
      OCTOPUS_SERVER_PORT: ${{ secrets.OCTOPUS_SERVER_PORT || '8080' }}
      SSHPASS: ${{ secrets.JD_SSH_PASSWORD }}
      TARGET_ARCH: ${{ github.event.inputs.target_arch || secrets.JD_TARGET_ARCH || 'amd64' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set App Version
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_APP_VERSION="${{ env.APP_VERSION }}" pnpm build

      - name: Embed frontend
        run: |
          rm -rf static/out
          mv web/out static/out

      - name: Build Linux binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/deploy
          # 将 Go 后端源码以及 static 目录打包为 octopus-${GITHUB_SHA}-${TARGET_ARCH}.tgz
          tar -czf "octopus-${GITHUB_SHA}-${TARGET_ARCH}.tgz" main.go go.mod go.sum internal cmd static

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail

          for name in JD_HOST JD_PORT JD_USER JD_APP_DIR JD_SERVICE_NAME SSHPASS OCTOPUS_SERVER_PORT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required"
              exit 1
            fi
          done

          case "$JD_APP_DIR" in
            /opt/octopus|/opt/octopus/*) ;;
            *)
              echo "::error::JD_APP_DIR must be /opt/octopus or a child directory"
              exit 1
              ;;
          esac

          sudo apt-get update
          sudo apt-get install -y sshpass

          mkdir -p ~/.ssh
          ssh-keyscan -p "$JD_PORT" "$JD_HOST" > ~/.ssh/known_hosts.new
          if [ -n "${JD_HOST_FINGERPRINT:-}" ]; then
            if ! ssh-keygen -lf ~/.ssh/known_hosts.new -E sha256 | awk '{print $2}' | grep -Fx "$JD_HOST_FINGERPRINT"; then
              echo "::error::Host key fingerprint mismatch"
              ssh-keygen -lf ~/.ssh/known_hosts.new -E sha256 || true
              exit 1
            fi
          fi
          mv ~/.ssh/known_hosts.new ~/.ssh/known_hosts

          archive="octopus-${GITHUB_SHA}-${TARGET_ARCH}.tgz"
          echo "Uploading $archive to $JD_USER@$JD_HOST:/tmp/$archive ..."
          timeout 900s sshpass -e scp -v -l 4096 -P "$JD_PORT" \
            -O \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -o IPQoS=none \
            "$archive" "$JD_USER@$JD_HOST:/tmp/$archive"
          echo "Upload completed."

          echo "Running remote deploy script ..."
          timeout 300s sshpass -e ssh -p "$JD_PORT" -o StrictHostKeyChecking=yes "$JD_USER@$JD_HOST" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -o IPQoS=none \
            "DEPLOY_SHA='$GITHUB_SHA' DEPLOY_ARCHIVE='/tmp/$archive' JD_APP_DIR='$JD_APP_DIR' JD_SERVICE_NAME='$JD_SERVICE_NAME' OCTOPUS_SERVER_PORT='$OCTOPUS_SERVER_PORT' bash -s" <<'REMOTE'
          set -euo pipefail

          app_dir="$JD_APP_DIR"
          service="$JD_SERVICE_NAME"
          archive="$DEPLOY_ARCHIVE"
          release="$app_dir/releases/$DEPLOY_SHA"
          backup_dir="/var/backups/octopus"

          case "$app_dir" in
            /opt/octopus|/opt/octopus/*) ;;
            *)
              echo "Refuse to deploy outside /opt/octopus: $app_dir"
              exit 1
              ;;
          esac

          test -f "$archive"
          mkdir -p "$app_dir/releases" "$app_dir/data" "$backup_dir"
          rm -rf "$release"
          mkdir -p "$release"
          tar -xzf "$archive" -C "$release"

          # 远程 Go 1.25.0 编译器环境检测与安装
          go_cmd="go"
          if ! command -v go &>/dev/null; then
            if [ -x "/usr/local/go/bin/go" ]; then
              go_cmd="/usr/local/go/bin/go"
            else
              echo "Go not found. Installing green Go 1.25.0..."
              wget -O /tmp/go1.25.0.linux-amd64.tar.gz https://mirrors.aliyun.com/golang/go1.25.0.linux-amd64.tar.gz || \
              curl -o /tmp/go1.25.0.linux-amd64.tar.gz https://mirrors.aliyun.com/golang/go1.25.0.linux-amd64.tar.gz
              mkdir -p /tmp/go_temp
              tar -C /tmp/go_temp -xzf /tmp/go1.25.0.linux-amd64.tar.gz
              go_cmd="/tmp/go_temp/go/bin/go"
            fi
          else
            go_ver=$("$go_cmd" version | awk '{print $3}' | sed 's/go//')
            if [ "$(printf '%s\n' "1.25.0" "$go_ver" | sort -V | head -n1)" = "1.25.0" ] && [ "$go_ver" != "1.25.0" ]; then
              if [ -x "/tmp/go_temp/go/bin/go" ]; then
                go_cmd="/tmp/go_temp/go/bin/go"
              else
                echo "Current Go version is $go_ver (lower than 1.25.0). Downloading green Go 1.25.0..."
                wget -O /tmp/go1.25.0.linux-amd64.tar.gz https://mirrors.aliyun.com/golang/go1.25.0.linux-amd64.tar.gz || \
                curl -o /tmp/go1.25.0.linux-amd64.tar.gz https://mirrors.aliyun.com/golang/go1.25.0.linux-amd64.tar.gz
                mkdir -p /tmp/go_temp
                tar -C /tmp/go_temp -xzf /tmp/go1.25.0.linux-amd64.tar.gz
                go_cmd="/tmp/go_temp/go/bin/go"
              fi
            fi
          fi

          echo "Compiling on remote server using $go_cmd..."
          BUILD_TIME="$(TZ='Asia/Shanghai' date +'%F %T %z')"
          GIT_VERSION="${{ env.APP_VERSION }}"
          LDFLAGS="-X 'github.com/bestruirui/octopus/internal/conf.Version=${GIT_VERSION}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.BuildTime=${BUILD_TIME}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Author=hureru' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Commit=${DEPLOY_SHA::7}' \
                   -s -w"

          cd "$release"
          GOPROXY=https://goproxy.cn,direct CGO_ENABLED=0 "$go_cmd" build -o octopus -ldflags="${LDFLAGS}" -tags=jsoniter ./
          chmod +x "$release/octopus"
          test -x "$release/octopus"

          cd "$app_dir"

          if [ -e "$app_dir/current/octopus" ]; then
            cp -a "$app_dir/current/octopus" "$backup_dir/octopus-$(date +%Y%m%d%H%M%S)"
          fi

          ln -sfn "$release" "$app_dir/current"

          cat > "/etc/systemd/system/${service}.service" <<SERVICE
          [Unit]
          Description=Octopus LLM API Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=${app_dir}
          ExecStart=${app_dir}/current/octopus start --config ${app_dir}/data/config.json
          Restart=always
          RestartSec=5
          Environment=OCTOPUS_SERVER_HOST=0.0.0.0
          Environment=OCTOPUS_SERVER_PORT=${OCTOPUS_SERVER_PORT}

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable "$service"
          systemctl restart "$service"
          systemctl --no-pager --full status "$service"

          rm -f "$archive"
          find "$app_dir/releases" -mindepth 1 -maxdepth 1 -type d | sort | head -n -5 | xargs -r rm -rf
          echo "Deployed $DEPLOY_SHA to $app_dir"
          REMOTE

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          public_url="${JD_PUBLIC_URL:-http://${JD_HOST}:${OCTOPUS_SERVER_PORT}}"
          curl -fsS -o /tmp/octopus-index.html "$public_url/?sha=${GITHUB_SHA}"
          grep -qi '<html' /tmp/octopus-index.html
